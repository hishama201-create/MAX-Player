name: Android CI

env:
  main_project_module: app

permissions: {}

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  translators:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch translators from Weblate
        continue-on-error: true
        run: python3 scripts/fetch_translators.py translators.json

      - name: Upload translators.json
        if: hashFiles('translators.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: translators-json
          path: translators.json

  build:
    needs: translators
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Download translators.json
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: translators-json
          path: app/src/main/assets

      - name: Configure Keystore & Properties
        run: |
          echo "${{ secrets.BASE_64_SIGNING_KEY }}" | base64 -d > app/release_keystore.jks
          touch local.properties
          printf "%s" "${{ secrets.LOCAL_PROPERTIES }}" > keystore.properties
          chmod +x gradlew

      - name: Build github APK release
        run: ./gradlew assembleGithubRelease --warning-mode all

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-Player-universal-release
          path: ${{ env.main_project_module }}/build/outputs/apk/github/release/*universal*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MAX-Player-universal-release
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
